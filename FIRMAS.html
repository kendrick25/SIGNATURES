<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmas Vectoriales</title>
    <meta name="description" content="Generador de firmas digitales de alta calidad.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <!-- Heroicons / Lucide icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Signature Pad Library -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@5.0.2/dist/signature_pad.umd.min.js"></script>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/workspace.css">
</head>

<body>

    <div class="container">
        <!-- Floating Top Bar -->
        <div class="top-bar">
            <!-- MODOS -->
            <div class="stroke-presets" id="modeToggle">
                <button class="preset-btn active" data-mode="draw" title="Modo Dibujo (P)">
                    <i data-lucide="pencil" size="18"></i>
                </button>
                <button class="preset-btn" data-mode="select" title="Modo Selección (V)">
                    <i data-lucide="mouse-pointer-2" size="18"></i>
                </button>
                <button class="preset-btn" data-mode="transform" title="Modo Transformar (T)">
                    <i data-lucide="move-diagonal" size="18"></i>
                </button>
                <button class="preset-btn" data-mode="pan" title="Mover Espacio (H)">
                    <i data-lucide="hand" size="18"></i>
                </button>
            </div>

            <div class="tool-separator"></div>

            <!-- UNDO/CLEAR -->
            <div class="tool-group">
                <button class="btn-secondary" id="undoBtn" title="Deshacer" style="padding: 0.6rem;" disabled>
                    <i data-lucide="undo" size="18"></i>
                </button>
                <button class="btn-secondary" id="redoBtn" title="Rehacer" style="padding: 0.6rem;" disabled>
                    <i data-lucide="redo" size="18"></i>
                </button>
                <button class="btn-secondary" id="clearBtn" title="Limpiar" style="padding: 0.6rem;">
                    <i data-lucide="trash-2" size="18"></i>
                </button>
            </div>

            <div class="tool-separator"></div>

            <!-- EXPORT ACTIONS -->
            <div class="tool-group">
                <div class="dropdown" id="exportDropdown">
                    <button class="btn-primary" id="exportMainBtn" style="padding: 0.6rem 1rem;">
                        <i data-lucide="download" size="18"></i>
                        EXPORTAR
                        <i data-lucide="chevron-down" size="14" style="margin-left: 4px; opacity: 0.7;"></i>
                    </button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" id="copyPngBtn">
                            <i data-lucide="copy" size="16"></i>
                            Copiar PNG al Portapapeles
                        </button>
                        <button class="dropdown-item" id="downloadPngBtn">
                            <i data-lucide="image" size="16"></i>
                            Descargar como PNG
                        </button>
                        <button class="dropdown-item" id="downloadSvgBtn">
                            <i data-lucide="file-code" size="16"></i>
                            Descargar como SVG
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Side Panel -->
        <div class="side-panel" id="sidePanel">
            <div class="side-panel-header">
                <div style="display: flex; gap: 0.25rem;">
                    <button class="panel-toggle-btn" id="dockBtn" title="Acoplar/Flotar">
                        <i data-lucide="layout-sidebar" size="16"></i>
                    </button>
                    <span id="panelTitle"
                        style="font-size: 0.85rem; font-weight: 700; color: var(--text-main); align-self: center; margin-left: 0.5rem;">PANEL
                        DE CONTROL</span>
                </div>
                <button class="panel-toggle-btn" id="minimizeBtn" title="Minimizar (M)">
                    <i data-lucide="palette" size="18" id="minimizeIcon"></i>
                </button>
            </div>

            <div class="side-panel-content" id="sidePanelContent">


                <!-- Group TRAZO -->
                <div
                    style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 16px; border: 1px solid var(--glass-border);">
                    <span style="font-size: 0.8rem; color: var(--text-dim); font-weight: 700;"
                        data-i18n="stroke">TRAZO</span>

                    <div style="display: flex; flex-direction: column; gap: 1.2rem;">
                        <!-- Estilo (Tabs) -->
                        <div class="stroke-presets" id="strokeTypePresets"
                            style="width: 100%; display: flex; justify-content: center; gap: 4px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 12px; border: 1px solid var(--glass-border);">
                            <button class="preset-btn active" data-preset="natural" id="btnNatural"
                                style="font-size: 0.65rem; flex: 1; padding: 0.5rem; justify-content: center;"
                                data-i18n="natural">Natural</button>
                            <button class="preset-btn" data-preset="marker" id="btnMarker"
                                style="font-size: 0.65rem; flex: 1; padding: 0.5rem; justify-content: center;"
                                data-i18n="marker">Marcador</button>
                            <button class="preset-btn" data-preset="pen" id="btnPen"
                                style="font-size: 0.65rem; flex: 1; padding: 0.5rem; justify-content: center;"
                                data-i18n="pen">Pluma</button>
                        </div>

                        <!-- Previsualización -->
                        <div class="stroke-preview-container" style="margin-top: 0;">
                            <span class="preview-label" data-i18n="preview">PREVISUALIZACIÓN</span>
                            <canvas id="strokePreviewCanvas"></canvas>
                        </div>

                        <!-- Tinta (Color) -->
                        <div style="display: flex; flex-direction: column; gap: 0.6rem;">
                            <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;"
                                data-i18n="color">COLOR</span>
                            <div class="color-picker" id="colorPicker" style="flex-wrap: wrap; gap: 8px;">
                                <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
                                <div class="color-dot" style="background: #6366f1;" data-color="#6366f1"></div>
                                <div class="color-dot" style="background: #06b6d4;" data-color="#06b6d4"></div>
                                <div class="color-dot"
                                    style="background: #000000; border: 1px solid var(--glass-border);"
                                    data-color="#000000"></div>
                                <div class="custom-color-btn" id="customColorBtn" title="Color personalizado">
                                    <i data-lucide="plus" size="12"></i>
                                </div>
                                <input type="color" id="hiddenColorInput" style="display: none;">
                            </div>
                        </div>

                        <!-- Opacidad -->
                        <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;"
                                    data-i18n="opacity">OPACIDAD</span>
                                <span id="alphaVal"
                                    style="font-size: 0.75rem; font-weight: 700; color: white;">100%</span>
                            </div>
                            <input type="range" id="alphaSlider" min="0.1" max="1.0" step="0.05" value="1.0"
                                style="width: 100%; accent-color: var(--primary); height: 8px; cursor: pointer;">
                        </div>

                        <!-- Grosor -->
                        <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                            <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;"
                                data-i18n="thickness">GROSOR</span>
                            <div class="thickness-control">
                                <button class="scrub-btn" id="decWidth"><i data-lucide="minus" size="10"></i></button>
                                <div class="scrub-area" id="thicknessScrubArea">
                                    <input type="number" class="thickness-input" id="thicknessVal" value="2.5"
                                        step="0.1" min="1" max="20">
                                </div>
                                <button class="scrub-btn" id="incWidth"><i data-lucide="plus" size="10"></i></button>
                            </div>
                            <input type="range" id="thicknessSlider" min="1" max="20" step="0.1" value="2.5"
                                style="width: 100%; accent-color: var(--primary); height: 4px;">
                        </div>
                    </div>
                </div>

                <!-- Group LIENZO -->
                <div
                    style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 16px; border: 1px solid var(--glass-border); margin-top: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.8rem; color: var(--text-dim); font-weight: 700;"
                            data-i18n="canvas">LIENZO</span>
                    </div>

                    <!-- Size Presets -->
                    <div class="stroke-presets" id="canvasSizePresets"
                        style="width: 100%; display: flex; justify-content: center; gap: 4px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 12px; border: 1px solid var(--glass-border);">
                        <button class="preset-btn active" data-size="normal"
                            style="font-size: 0.65rem; flex: 1; padding: 0.5rem; justify-content: center;"
                            data-i18n="normal">Normal</button>
                        <button class="preset-btn" data-size="medium"
                            style="font-size: 0.65rem; flex: 1; padding: 0.5rem; justify-content: center;"
                            data-i18n="medium">Medio</button>
                        <button class="preset-btn" data-size="large"
                            style="font-size: 0.65rem; flex: 1; padding: 0.5rem; justify-content: center;"
                            data-i18n="large">Grande</button>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- Ancho -->
                        <div style="display: flex; flex-direction: column; gap: 0.6rem;">
                            <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;"
                                data-i18n="width">ANCHO</span>
                            <div class="thickness-control">
                                <button class="scrub-btn" id="decCanvasWidth"><i data-lucide="minus"
                                        size="10"></i></button>
                                <div class="scrub-area" id="widthScrubArea">
                                    <input type="number" class="thickness-input" id="canvasWidthVal" value="836">
                                </div>
                                <button class="scrub-btn" id="incCanvasWidth"><i data-lucide="plus"
                                        size="10"></i></button>
                            </div>
                            <input type="range" id="widthSlider" min="200" max="2000" step="10" value="836"
                                style="width: 100%; accent-color: var(--primary); height: 4px;">
                        </div>
                        <!-- Alto -->
                        <div style="display: flex; flex-direction: column; gap: 0.6rem;">
                            <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;"
                                data-i18n="height">ALTO</span>
                            <div class="thickness-control">
                                <button class="scrub-btn" id="decCanvasHeight"><i data-lucide="minus"
                                        size="10"></i></button>
                                <div class="scrub-area" id="heightScrubArea">
                                    <input type="number" class="thickness-input" id="canvasHeightVal" value="400">
                                </div>
                                <button class="scrub-btn" id="incCanvasHeight"><i data-lucide="plus"
                                        size="10"></i></button>
                            </div>
                            <input type="range" id="heightSlider" min="100" max="1000" step="10" value="400"
                                style="width: 100%; accent-color: var(--primary); height: 4px;">
                        </div>

                        <!-- Zoom -->
                        <div style="display: flex; flex-direction: column; gap: 0.6rem;">
                            <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;"
                                data-i18n="zoom">ZOOM</span>
                            <div class="thickness-control">
                                <button class="scrub-btn" id="decZoom"><i data-lucide="minus" size="10"></i></button>
                                <div class="scrub-area" id="zoomScrubArea">
                                    <input type="number" class="thickness-input" id="zoomVal" value="100" step="1"
                                        min="10" max="500">
                                    <span style="font-size: 0.7rem; color: var(--text-dim); margin-right: 8px;">%</span>
                                </div>
                                <button class="scrub-btn" id="incZoom"><i data-lucide="plus" size="10"></i></button>
                            </div>
                            <input type="range" id="zoomSlider" min="10" max="500" step="1" value="100"
                                style="width: 100%; accent-color: var(--primary); height: 4px;">
                        </div>
                    </div>
                </div>

                <!-- Group CONFIGURACIÓN -->
                <div
                    style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; margin-bottom: 0.5rem;">
                    <div class="settings-row">
                        <span class="settings-label" data-i18n="fullscreen">PANTALLA COMPLETA</span>
                        <button class="panel-toggle-btn" id="fullscreenBtn" style="padding: 2px;">
                            <i data-lucide="maximize" size="16"></i>
                        </button>
                    </div>
                    <div class="settings-row">
                        <span class="settings-label" data-i18n="darkMode">MODO OSCURO</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="darkModeToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="settings-row">
                        <span class="settings-label" data-i18n="language">IDIOMA</span>
                        <div style="display: flex; gap: 4px;">
                            <button class="lang-btn active" data-lang="es">ES</button>
                            <button class="lang-btn" data-lang="en">EN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="workspace" id="workspace">
            <div class="workspace-controls-bottom">
                <button class="btn-secondary" id="centerCanvasBtn" title="Volver al lienzo">
                    <i data-lucide="focus" size="14"></i>
                    RECENTRAR
                </button>
                <button class="btn-secondary" id="resetSizeBtn">
                    <i data-lucide="maximize" size="14"></i>
                    AJUSTAR AUTOMÁTICAMENTE
                </button>
            </div>

            <div class="canvas-container" id="canvasContainer">
                <div class="selected-stroke-info" id="selectionInfo">Trazos Seleccionados: 0</div>
                <div id="selectionBox" class="selection-box"></div>
                <div id="selectedBounds" class="selected-bounds">
                    <div class="resize-handle handle-r" id="resizeHandleR" data-type="width"></div>
                    <div class="resize-handle handle-b" id="resizeHandleB" data-type="height"></div>
                    <div class="resize-handle handle-br" id="resizeHandleBR" data-type="both"></div>
                </div>
                <div class="canvas-hint" id="canvasHint">
                    <i data-lucide="pen-tool" size="32"
                        style="margin-bottom: 0.5rem; display: block; margin-left: auto; margin-right: auto;"></i>
                    Dibuja tu firma aquí<br>
                    <span style="font-size: 0.7rem;">(Compatible con tabletas digitales)</span>
                </div>
                <canvas id="signatureCanvas"></canvas>
                <canvas id="selectionCanvas"
                    style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
            </div>
        </div>

        <div class="toast" id="toast">Firma copiada al portapapeles</div>

        <script>
            // Initialize Lucide icons
            lucide.createIcons();

            const canvas = document.getElementById('signatureCanvas');
            const container = document.getElementById('canvasContainer');
            const hint = document.getElementById('canvasHint');
            const clearBtn = document.getElementById('clearBtn');
            const undoBtn = document.getElementById('undoBtn');
            const copySvgBtn = document.getElementById('copySvgBtn');
            const downloadSvgBtn = document.getElementById('downloadSvgBtn');
            const colorDots = document.querySelectorAll('.color-dot');
            const toast = document.getElementById('toast');
            const thicknessVal = document.getElementById('thicknessVal');
            const thicknessSlider = document.getElementById('thicknessSlider');
            const decWidth = document.getElementById('decWidth');
            const incWidth = document.getElementById('incWidth');
            const thicknessScrubArea = document.getElementById('thicknessScrubArea');
            const cropBtn = document.getElementById('cropBtn');

            const canvasWidthVal = document.getElementById('canvasWidthVal');
            const widthScrubArea = document.getElementById('widthScrubArea');
            const canvasHeightVal = document.getElementById('canvasHeightVal');
            const heightScrubArea = document.getElementById('heightScrubArea');
            const widthSlider = document.getElementById('widthSlider');
            const heightSlider = document.getElementById('heightSlider');

            const presetBtns = document.querySelectorAll('.preset-btn');
            const resetSizeBtn = document.getElementById('resetSizeBtn');
            const centerCanvasBtn = document.getElementById('centerCanvasBtn');
            const workspace = document.getElementById('workspace');
            const modeBtns = document.querySelectorAll('#modeToggle .preset-btn');
            const selectionInfo = document.getElementById('selectionInfo');

            const ctx = canvas.getContext('2d');
            const selectionCanvas = document.getElementById('selectionCanvas');
            const sctx = selectionCanvas.getContext('2d');

            let currentThickness = 2.5;
            let history = []; // Stack of full states
            let redoStack = [];
            let currentMode = 'draw'; // 'draw', 'select', 'pan', 'transform'
            let currentStrokeType = 'natural';
            let currentAlpha = 1.0;
            let selectedStrokeIndices = [];
            let isSelecting = false;
            let isMoving = false;
            let isResizing = false;
            let isPanning = false;
            let selectStart = { x: 0, y: 0 };
            let moveStart = { x: 0, y: 0 };
            let resizeStart = { x: 0, y: 0 };
            let panStart = { x: 0, y: 0 };
            let workspacePan = { x: 0, y: 0 };
            let workspaceScale = 1.0;
            let modeBeforeMiddleClick = null;

            // Setup Signature Pad
            const signaturePad = new SignaturePad(canvas, {
                backgroundColor: 'rgba(0,0,0,0)',
                penColor: '#ffffff',
                minWidth: 1.5,
                maxWidth: 4.5,
                velocityFilterWeight: 0.7
            });

            // Resize Canvas Logic
            const observer = new ResizeObserver(() => {
                syncSizeValues();
                resizeCanvas();
            });
            observer.observe(container);

            function syncSizeValues() {
                if (document.activeElement !== canvasWidthVal) canvasWidthVal.value = Math.round(container.offsetWidth);
                if (document.activeElement !== canvasHeightVal) canvasHeightVal.value = Math.round(container.offsetHeight);
            }

            function resizeCanvas() {
                const data = signaturePad.toData();
                const ratio = Math.max(window.devicePixelRatio || 1, 1);

                const newWidth = container.offsetWidth * ratio;
                const newHeight = container.offsetHeight * ratio;

                if (canvas.width !== newWidth || canvas.height !== newHeight) {
                    canvas.width = newWidth;
                    canvas.height = newHeight;
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.scale(ratio, ratio);

                    selectionCanvas.width = newWidth;
                    selectionCanvas.height = newHeight;
                    sctx.setTransform(1, 0, 0, 1, 0, 0);
                    sctx.scale(ratio, ratio);

                    signaturePad.clear();
                    if (data.length > 0) {
                        signaturePad.fromData(data);
                        hint.classList.add('hidden');
                    } else {
                        hint.classList.remove('hidden');
                    }
                    drawSelectionHighlights();
                }
            }

            // History System
            function saveState() {
                const data = signaturePad.toData();
                const selection = [...selectedStrokeIndices];
                history.push({ data, selection });
                redoStack = [];
                if (history.length > 50) history.shift();
                updateHistoryButtons();
            }

            function undo() {
                if (history.length > 0) {
                    // Current state to redo
                    const currentData = signaturePad.toData();
                    const currentSelection = [...selectedStrokeIndices];
                    redoStack.push({ data: currentData, selection: currentSelection });

                    // Restore last state
                    const lastState = history.pop();
                    signaturePad.fromData(lastState.data);
                    selectedStrokeIndices = lastState.selection || []; // Restore selection

                    if (lastState.data.length === 0) hint.classList.remove('hidden');
                    else hint.classList.add('hidden');

                    updateSelectedBounds();
                    drawSelectionHighlights();
                    syncControlsWithSelection(); // Helper to sync UI
                    updateHistoryButtons();
                }
            }

            function redo() {
                if (redoStack.length > 0) {
                    // Current state to history
                    const currentData = signaturePad.toData();
                    const currentSelection = [...selectedStrokeIndices];
                    history.push({ data: currentData, selection: currentSelection });

                    // Restore next state
                    const nextState = redoStack.pop();
                    signaturePad.fromData(nextState.data);
                    selectedStrokeIndices = nextState.selection || [];

                    hint.classList.add('hidden');
                    updateSelectedBounds();
                    drawSelectionHighlights();
                    syncControlsWithSelection();
                    updateHistoryButtons();
                }
            }

            function updateHistoryButtons() {
                document.getElementById('undoBtn').disabled = history.length === 0;
                document.getElementById('redoBtn').disabled = redoStack.length === 0;
            }

            // Thickness Logic
            function updateThickness(newVal) {
                currentThickness = Math.max(1, Math.min(20, parseFloat(parseFloat(newVal).toFixed(1))));
                thicknessVal.value = currentThickness;
                thicknessSlider.value = currentThickness;

                if ((currentMode === 'select' || currentMode === 'transform') && selectedStrokeIndices.length > 0) {
                    saveState(); // Save BEFORE modification

                    const data = signaturePad.toData();
                    selectedStrokeIndices.forEach(index => {
                        if (data[index]) {
                            let min, max;
                            if (currentStrokeType === 'marker') { min = currentThickness; max = currentThickness; }
                            else if (currentStrokeType === 'pen') { min = currentThickness * 0.3; max = currentThickness * 2.5; }
                            else { min = currentThickness * 0.6; max = currentThickness * 1.8; }
                            data[index].minWidth = min;
                            data[index].maxWidth = max;
                        }
                    });
                    signaturePad.fromData(data);
                    drawSelectionHighlights();
                } else {
                    updateStrokeStyles();
                }
                updateStrokePreview();
            }

            thicknessSlider.addEventListener('input', (e) => updateThickness(e.target.value));

            function updateStrokeStyles() {
                const preset = currentStrokeType;
                switch (preset) {
                    case 'marker':
                        signaturePad.minWidth = currentThickness;
                        signaturePad.maxWidth = currentThickness;
                        signaturePad.velocityFilterWeight = 1;
                        break;
                    case 'pen':
                        signaturePad.minWidth = currentThickness * 0.3;
                        signaturePad.maxWidth = currentThickness * 2.5;
                        signaturePad.velocityFilterWeight = 0.4;
                        break;
                    case 'natural':
                    default:
                        signaturePad.minWidth = currentThickness * 0.6;
                        signaturePad.maxWidth = currentThickness * 1.8;
                        signaturePad.velocityFilterWeight = 0.7;
                        break;
                }
                updateStrokePreview();
            }

            // Scrubbing Base Logic
            function setupScrubber(element, onUpdate, getStartVal, step = 0.1) {
                let scrubbing = false;
                let startPos = 0;
                let currentStartVal = 0;
                let moved = false;

                element.addEventListener('mousedown', (e) => {
                    scrubbing = true;
                    startPos = e.clientX;
                    currentStartVal = getStartVal();
                    moved = false;
                    document.body.style.cursor = 'ew-resize';

                    // Don't preventDefault here to allow potential focus
                });

                window.addEventListener('mousemove', (e) => {
                    if (!scrubbing) return;

                    const deltaX = e.clientX - startPos;
                    if (Math.abs(deltaX) > 4) {
                        moved = true;
                        // Prevent text selection while scrubbing
                        window.getSelection().removeAllRanges();
                        const delta = deltaX * step;
                        onUpdate(currentStartVal + delta);
                    }
                });

                window.addEventListener('mouseup', (e) => {
                    if (!scrubbing) return;
                    scrubbing = false;
                    document.body.style.cursor = 'default';

                    // Only if it was a click (not a move) and target is input, focus/select it
                    if (!moved && e.target.tagName === 'INPUT') {
                        e.target.focus();
                        e.target.select();
                    }
                });
            }

            // Initialize Scrubber Instances
            setupScrubber(thicknessScrubArea, updateThickness, () => currentThickness, 0.1);

            setupScrubber(widthScrubArea, (val) => {
                const w = Math.max(200, Math.round(val));
                container.style.width = w + 'px';
                canvasWidthVal.value = w;
                widthSlider.value = w;
            }, () => container.offsetWidth, 1);

            setupScrubber(heightScrubArea, (val) => {
                const h = Math.max(100, Math.round(val));
                container.style.height = h + 'px';
                canvasHeightVal.value = h;
                heightSlider.value = h;
            }, () => container.offsetHeight, 1);

            // Edit directly via click/input
            thicknessVal.addEventListener('change', (e) => updateThickness(e.target.value));
            canvasWidthVal.addEventListener('change', (e) => {
                const val = Math.max(200, parseInt(e.target.value));
                container.style.width = val + 'px';
                widthSlider.value = val;
            });
            canvasHeightVal.addEventListener('change', (e) => {
                const val = Math.max(100, parseInt(e.target.value));
                container.style.height = val + 'px';
                heightSlider.value = val;
            });

            widthSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                container.style.width = val + 'px';
                canvasWidthVal.value = val;
            });
            heightSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                container.style.height = val + 'px';
                canvasHeightVal.value = val;
            });

            // Long Press / Repeat Logic
            function setupLongPress(btn, action) {
                let timer;
                let interval;
                const start = (e) => {
                    if (e.type === 'mousedown' && e.button !== 0) return;
                    action();
                    timer = setTimeout(() => {
                        interval = setInterval(action, 80);
                    }, 400);
                };
                const stop = () => {
                    clearTimeout(timer);
                    clearInterval(interval);
                };
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', stop);
                btn.addEventListener('mouseleave', stop);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); });
                btn.addEventListener('touchend', stop);
            }

            // Incremental Buttons
            setupLongPress(decWidth, () => updateThickness(currentThickness - 1));
            setupLongPress(incWidth, () => updateThickness(currentThickness + 1));

            setupLongPress(document.getElementById('decCanvasWidth'), () => {
                const w = Math.max(200, container.offsetWidth - 1);
                container.style.width = w + 'px';
                canvasWidthVal.value = w;
                widthSlider.value = w;
            });
            setupLongPress(document.getElementById('incCanvasWidth'), () => {
                const w = container.offsetWidth + 1;
                container.style.width = w + 'px';
                canvasWidthVal.value = w;
                widthSlider.value = w;
            });
            setupLongPress(document.getElementById('decCanvasHeight'), () => {
                const h = Math.max(100, container.offsetHeight - 1);
                container.style.height = h + 'px';
                canvasHeightVal.value = h;
                heightSlider.value = h;
            });
            setupLongPress(document.getElementById('incCanvasHeight'), () => {
                const h = container.offsetHeight + 1;
                container.style.height = h + 'px';
                canvasHeightVal.value = h;
                heightSlider.value = h;
            });

            setupScrubber(document.getElementById('zoomScrubArea'), (val) => {
                workspaceScale = Math.max(0.1, Math.min(5, val / 100));
                updateWorkspaceTransform();
            }, () => workspaceScale * 100, 1);

            document.getElementById('zoomVal').addEventListener('change', (e) => {
                workspaceScale = Math.max(0.1, Math.min(5, parseInt(e.target.value) / 100));
                updateWorkspaceTransform();
            });

            document.getElementById('zoomSlider').addEventListener('input', (e) => {
                workspaceScale = parseInt(e.target.value) / 100;
                updateWorkspaceTransform();
            });

            // Canvas Size Presets
            const canvasSizeBtns = document.querySelectorAll('#canvasSizePresets .preset-btn');
            canvasSizeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const size = btn.dataset.size;
                    let w, h;
                    if (size === 'normal') { w = 800; h = 250; }
                    else if (size === 'medium') { w = 1200; h = 375; }
                    else if (size === 'large') { w = 1600; h = 500; }

                    canvasSizeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    container.style.width = w + 'px';
                    container.style.height = h + 'px';
                    canvasWidthVal.value = w;
                    canvasHeightVal.value = h;
                    widthSlider.value = w;
                    heightSlider.value = h;

                    // Trigger resize logic
                    resizeCanvas();
                });
            });

            setupLongPress(document.getElementById('decZoom'), () => {
                workspaceScale = Math.max(0.1, workspaceScale - 0.05);
                updateWorkspaceTransform();
            });
            setupLongPress(document.getElementById('incZoom'), () => {
                workspaceScale = Math.min(5, workspaceScale + 0.05);
                updateWorkspaceTransform();
            });

            resetSizeBtn.addEventListener('click', () => {
                container.style.width = '100vw';
                container.style.height = '400px';
                centerCanvas();
            });

            centerCanvasBtn.addEventListener('click', centerCanvas);

            function centerCanvas() {
                workspacePan = { x: 0, y: 0 };
                workspaceScale = 1.0;
                updateWorkspaceTransform();
            }

            function updateWorkspaceTransform() {
                container.style.transform = `translate(${workspacePan.x}px, ${workspacePan.y}px) scale(${workspaceScale})`;
                // Sync UI controls
                const zoomPercent = Math.round(workspaceScale * 100);
                document.getElementById('zoomVal').value = zoomPercent;
                document.getElementById('zoomSlider').value = zoomPercent;
            }

            // Wheel for Zoom
            workspace.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 0.001;
                const delta = -e.deltaY;

                // Direct zoom with wheel
                workspaceScale *= (1 + delta * zoomSpeed);

                // Clamp scale
                workspaceScale = Math.max(0.1, Math.min(5, workspaceScale));

                updateWorkspaceTransform();
            }, { passive: false });

            // Preset Buttons
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    presetBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateStrokeStyles();
                });
            });

            // Reveal/Hide Hint
            signaturePad.addEventListener("beginStroke", () => {
                hint.classList.add('hidden');
            });

            // Clear
            clearBtn.addEventListener('click', () => {
                signaturePad.clear();
                hint.classList.remove('hidden');
            });

            // Undo
            // Undo
            undoBtn.addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);

            // Initial State
            updateHistoryButtons();

            // Clear Redo stack on new stroke handled by saveState

            function setMode(mode) {
                currentMode = mode;
                modeBtns.forEach(btn => {
                    if (btn.dataset.mode === mode) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                if (currentMode === 'transform') {
                    canvas.style.cursor = 'move';
                    signaturePad.off(); // Disable drawing
                } else if (currentMode === 'select') {
                    canvas.style.cursor = 'default';
                    signaturePad.off();
                } else if (currentMode === 'pan') {
                    canvas.style.cursor = 'grab';
                    signaturePad.off();
                } else {
                    canvas.style.cursor = 'crosshair';
                    signaturePad.on(); // Enable drawing
                    deselectStroke();
                }
                updateSelectedBounds();
                drawSelectionHighlights();
            }

            // Mode Switch Logic
            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    setMode(btn.dataset.mode);
                });
            });

            const selectedBounds = document.getElementById('selectedBounds');
            let resizeType = ''; // 'width', 'height', or 'both'

            function updateSelectedBounds() {
                if (selectedStrokeIndices.length === 0 || (currentMode !== 'transform' && currentMode !== 'select')) {
                    selectedBounds.style.display = 'none';
                    return;
                }

                const data = signaturePad.toData();
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

                let hasStroke = false;
                selectedStrokeIndices.forEach(idx => {
                    if (data[idx]) {
                        hasStroke = true;
                        data[idx].points.forEach(p => {
                            minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
                            maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
                        });
                    }
                });

                if (!hasStroke) {
                    selectedBounds.style.display = 'none';
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const ratio = 1.0;

                const padding = 5;
                selectedBounds.style.left = (minX * ratio - padding) + 'px';
                selectedBounds.style.top = (minY * ratio - padding) + 'px';
                selectedBounds.style.width = ((maxX - minX) * ratio + padding * 2) + 'px';
                selectedBounds.style.height = ((maxY - minY) * ratio + padding * 2) + 'px';
                selectedBounds.style.display = 'block';

                if (currentMode === 'select') {
                    selectedBounds.classList.add('no-handles');
                    selectedBounds.style.border = 'none';
                    selectedBounds.style.opacity = '0'; // Invisible but present for click detection
                } else {
                    selectedBounds.classList.remove('no-handles');
                    selectedBounds.style.border = '1px dashed var(--primary)';
                    selectedBounds.style.opacity = '1';
                }
            }

            // Combined Selection and Move Logic - GLOBAL to catch handles
            window.addEventListener('mousedown', (e) => {
                // Middle click (button 1) always pans
                if (e.button === 1) {
                    if (currentMode !== 'pan') {
                        modeBeforeMiddleClick = currentMode;
                        setMode('pan');
                    }
                    isPanning = true;
                    panStart.x = e.clientX;
                    panStart.y = e.clientY;
                    canvas.style.cursor = 'grabbing';
                    e.preventDefault();
                    return;
                }

                if (currentMode === 'pan') {
                    isPanning = true;
                    panStart.x = e.clientX;
                    panStart.y = e.clientY;
                    canvas.style.cursor = 'grabbing';
                    e.preventDefault();
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                // Check if click is inside canvas or on handles
                const isInsideCanvas = (
                    e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom
                );

                // Or if it's on a handle (handles are outside canvas strictly speaking in DOM, but visually inside)
                const isHandle = e.target.classList.contains('resize-handle');

                if (!isInsideCanvas && !isHandle) return;

                canvasX = (e.clientX - rect.left) / workspaceScale;
                canvasY = (e.clientY - rect.top) / workspaceScale;

                if (currentMode === 'select' && isInsideCanvas) {
                    // Check if clicking inside an existing selection to move it
                    let clickedInsideSelection = false;
                    if (selectedStrokeIndices.length > 0) {
                        const bRect = selectedBounds.getBoundingClientRect();
                        if (e.clientX >= bRect.left && e.clientX <= bRect.right &&
                            e.clientY >= bRect.top && e.clientY <= bRect.bottom) {
                            clickedInsideSelection = true;
                        }
                    }

                    if (clickedInsideSelection) {
                        saveState(); // Save before moving
                        moveStart.x = e.clientX - rect.left;
                        moveStart.y = e.clientY - rect.top;
                        isMoving = true;
                    } else {
                        // Normal selection box start
                        // Selection change handled in findStrokesInArea -> selectStrokes
                        selectStart.x = e.clientX - rect.left;
                        selectStart.y = e.clientY - rect.top;
                        isSelecting = true;

                        selectionBox.style.left = selectStart.x + 'px';
                        selectionBox.style.top = selectStart.y + 'px';
                        selectionBox.style.width = '0px';
                        selectionBox.style.height = '0px';
                        selectionBox.style.display = 'block';
                    }
                } else if (currentMode === 'transform') {
                    if (selectedStrokeIndices.length === 0) {
                        if (isInsideCanvas) {
                            // Try to select the stroke under cursor first
                            findStrokesInArea(canvasX, canvasY, canvasX, canvasY, e.shiftKey, e.ctrlKey);
                            if (selectedStrokeIndices.length > 0) {
                                saveState(); // Save before moving
                                moveStart.x = canvasX / ratio;
                                moveStart.y = canvasY / ratio;
                                isMoving = true;
                            } else {
                                showToast("Primero selecciona trazos", "#6366f1");
                            }
                        }
                        return;
                    }

                    if (isHandle) {
                        resizeType = e.target.dataset.type;
                        isResizing = true;
                        resizeStart.x = canvasX;
                        resizeStart.y = canvasY;
                        saveState(); // Save before resizing
                    } else if (isInsideCanvas) {
                        // Check if click is within the selection bounds
                        const bRect = selectedBounds.getBoundingClientRect();
                        const padRect = canvas.getBoundingClientRect();
                        const isInsideSelection = (
                            e.clientX >= bRect.left && e.clientX <= bRect.right &&
                            e.clientY >= bRect.top && e.clientY <= bRect.bottom
                        );

                        if (isInsideSelection) {
                            saveState(); // Save before moving
                            moveStart.x = e.clientX - rect.left;
                            moveStart.y = e.clientY - rect.top;
                            isMoving = true;
                        } else {
                            // Clicked outside selection in transform mode
                            findStrokesInArea(canvasX, canvasY, canvasX, canvasY, e.shiftKey, e.ctrlKey);

                            // Keep the mode as 'transform' even if selection is cleared
                            updateSelectedBounds();
                        }
                    }
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    const dx = e.clientX - panStart.x;
                    const dy = e.clientY - panStart.y;
                    workspacePan.x += dx;
                    workspacePan.y += dy;
                    panStart.x = e.clientX;
                    panStart.y = e.clientY;
                    updateWorkspaceTransform();
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;

                if (isSelecting && currentMode === 'select') {
                    const x = Math.min(currentX, selectStart.x);
                    const y = Math.min(currentY, selectStart.y);
                    const w = Math.abs(currentX - selectStart.x);
                    const h = Math.abs(currentY - selectStart.y);

                    selectionBox.style.left = x + 'px';
                    selectionBox.style.top = y + 'px';
                    selectionBox.style.width = w + 'px';
                    selectionBox.style.height = h + 'px';
                } else if (isMoving && (currentMode === 'transform' || currentMode === 'select')) {
                    const dx = (currentX - moveStart.x) / workspaceScale;
                    const dy = (currentY - moveStart.y) / workspaceScale;

                    if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                        const data = signaturePad.toData();
                        selectedStrokeIndices.forEach(index => {
                            if (data[index]) {
                                data[index].points.forEach(point => {
                                    point.x += dx;
                                    point.y += dy;
                                });
                            }
                        });
                        signaturePad.fromData(data);
                        updateSelectedBounds();
                        drawSelectionHighlights();
                        moveStart.x = currentX;
                        moveStart.y = currentY;
                    }
                } else if (isResizing && currentMode === 'transform') {
                    const dx = (currentX - resizeStart.x) / workspaceScale;
                    const dy = (currentY - resizeStart.y) / workspaceScale;

                    const data = signaturePad.toData();
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    selectedStrokeIndices.forEach(idx => {
                        data[idx].points.forEach(p => {
                            minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
                            maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
                        });
                    });

                    const width = maxX - minX;
                    const height = maxY - minY;

                    let scaleX = 1;
                    let scaleY = 1;

                    if (resizeType === 'width' || resizeType === 'both') {
                        scaleX = (width + dx) / width;
                    }
                    if (resizeType === 'height' || resizeType === 'both') {
                        scaleY = (height + dy) / height;
                    }

                    // Limit minimum scale to avoid inversion
                    if (scaleX < 0.05) scaleX = 0.05;
                    if (scaleY < 0.05) scaleY = 0.05;

                    selectedStrokeIndices.forEach(index => {
                        if (data[index]) {
                            data[index].points.forEach(point => {
                                // Scale from the top-left of the selection
                                point.x = minX + (point.x - minX) * scaleX;
                                point.y = minY + (point.y - minY) * scaleY;
                                // Optionally scale pressure/width
                                point.pressure *= (scaleX + scaleY) / 2;
                            });
                            data[index].minWidth *= (scaleX + scaleY) / 2;
                            data[index].maxWidth *= (scaleX + scaleY) / 2;
                        }
                    });

                    signaturePad.fromData(data);
                    updateSelectedBounds();
                    drawSelectionHighlights();
                    resizeStart.x = currentX;
                    resizeStart.y = currentY;
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (isPanning) {
                    isPanning = false;
                    if (modeBeforeMiddleClick) {
                        setMode(modeBeforeMiddleClick);
                        modeBeforeMiddleClick = null;
                    } else if (currentMode === 'pan') {
                        canvas.style.cursor = 'grab';
                    }
                }
                if (isSelecting && currentMode === 'select') {
                    isSelecting = false;
                    selectionBox.style.display = 'none';

                    const rect = canvas.getBoundingClientRect();
                    const endX = e.clientX - rect.left;
                    const endY = e.clientY - rect.top;

                    const x1 = Math.min(selectStart.x, endX) / workspaceScale;
                    const y1 = Math.min(selectStart.y, endY) / workspaceScale;
                    const x2 = Math.max(selectStart.x, endX) / workspaceScale;
                    const y2 = Math.max(selectStart.y, endY) / workspaceScale;

                    findStrokesInArea(x1, y1, x2, y2, e.shiftKey, e.ctrlKey);
                } else if (isMoving) {
                    isMoving = false;
                    // saveState(); // Removed: Saved on mousedown
                } else if (isResizing) {
                    isResizing = false;
                    // saveState(); // Removed: Saved on mousedown
                }
            });

            function findStrokesInArea(x1, y1, x2, y2, shiftKey, ctrlKey) {
                const data = signaturePad.toData();
                const foundIndices = [];
                const isPointClick = Math.abs(x2 - x1) < 5 && Math.abs(y2 - y1) < 5;

                data.forEach((stroke, index) => {
                    let strokeMatch = false;
                    stroke.points.forEach(point => {
                        if (isPointClick) {
                            const dist = Math.sqrt((point.x - x1) ** 2 + (point.y - y1) ** 2);
                            if (dist < 20) strokeMatch = true;
                        } else {
                            if (point.x >= x1 && point.x <= x2 && point.y >= y1 && point.y <= y2) {
                                strokeMatch = true;
                            }
                        }
                    });
                    if (strokeMatch) foundIndices.push(index);
                });

                if (ctrlKey && isPointClick) {
                    // Toggle individual stroke
                    if (foundIndices.length > 0) {
                        const idx = foundIndices[0];
                        const alreadySelected = selectedStrokeIndices.indexOf(idx);
                        if (alreadySelected > -1) {
                            selectedStrokeIndices.splice(alreadySelected, 1);
                        } else {
                            selectedStrokeIndices.push(idx);
                        }
                    }
                    selectStrokes(selectedStrokeIndices);
                } else if (shiftKey) {
                    // Add area to selection
                    const newIndices = [...new Set([...selectedStrokeIndices, ...foundIndices])];
                    selectStrokes(newIndices);
                } else {
                    // Normal selection or click outside
                    if (foundIndices.length > 0) {
                        selectStrokes(foundIndices);
                    } else if (isPointClick) {
                        deselectStroke();
                    }
                }
            }

            function selectStrokes(indices, saveHistory = true) {
                // Check if different to avoid redundant saves
                const isSame = indices.length === selectedStrokeIndices.length &&
                    indices.every((val, index) => val === selectedStrokeIndices[index]);
                if (isSame) return;

                if (saveHistory) saveState();

                selectedStrokeIndices = indices;
                selectionInfo.innerText = `Trazos Seleccionados: ${indices.length}`;
                selectionInfo.style.display = indices.length > 0 ? 'block' : 'none';
                updateSelectedBounds();
                drawSelectionHighlights();
                syncControlsWithSelection();
            }

            function syncControlsWithSelection() {
                if (selectedStrokeIndices.length > 0) {
                    // Sync controls with the first selected stroke
                    const data = signaturePad.toData();
                    const firstStroke = data[selectedStrokeIndices[0]];
                    if (firstStroke) {
                        currentThickness = (firstStroke.maxWidth + firstStroke.minWidth) / 2;
                        thicknessVal.value = currentThickness.toFixed(1);
                        thicknessSlider.value = currentThickness;

                        colorDots.forEach(dot => {
                            if (dot.getAttribute('data-color') === firstStroke.color) {
                                colorDots.forEach(d => d.classList.remove('active'));
                                dot.classList.add('active');
                                lastBaseColor = dot.getAttribute('data-color');
                            }
                        });
                    }
                }
            }

            function deselectStroke(saveHistory = true) {
                if (selectedStrokeIndices.length === 0) return;

                if (saveHistory) saveState();

                selectedStrokeIndices = [];
                selectionInfo.style.display = 'none';
                updateSelectedBounds();
                drawSelectionHighlights();
            }

            function drawSelectionHighlights() {
                sctx.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
                if (selectedStrokeIndices.length === 0 || currentMode !== 'select') return;

                const data = signaturePad.toData();
                sctx.lineCap = 'round';
                sctx.lineJoin = 'round';

                selectedStrokeIndices.forEach(idx => {
                    const stroke = data[idx];
                    if (!stroke || stroke.points.length < 2) return;

                    // Draw a highlight "glow"
                    sctx.beginPath();
                    sctx.moveTo(stroke.points[0].x, stroke.points[0].y);
                    stroke.points.forEach((p, i) => {
                        if (i > 0) sctx.lineTo(p.x, p.y);
                    });

                    sctx.strokeStyle = 'rgba(99, 102, 241, 0.3)';
                    sctx.lineWidth = (stroke.maxWidth + stroke.minWidth) + 10;
                    sctx.stroke();

                    // Inner highlight border
                    sctx.strokeStyle = 'rgba(99, 102, 241, 0.8)';
                    sctx.lineWidth = 2;
                    sctx.stroke();
                });
            }

            // Color and Alpha Logic
            const alphaSlider = document.getElementById('alphaSlider');
            const alphaVal = document.getElementById('alphaVal');
            const customColorBtn = document.getElementById('customColorBtn');
            const hiddenColorInput = document.getElementById('hiddenColorInput');

            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            let lastBaseColor = "#ffffff";

            function applyColor(colorHex) {
                lastBaseColor = colorHex;
                const finalColor = hexToRgba(colorHex, currentAlpha);
                signaturePad.penColor = finalColor;

                if ((currentMode === 'select' || currentMode === 'transform') && selectedStrokeIndices.length > 0) {
                    saveState(); // Save BEFORE modification

                    const data = signaturePad.toData();
                    let modified = false;
                    selectedStrokeIndices.forEach(index => {
                        if (data[index]) {
                            data[index].color = finalColor;
                            modified = true;
                        }
                    });
                    if (modified) {
                        signaturePad.fromData(data);
                        // saveState(); // Removed: Saved before
                        updateSelectedBounds();
                    }
                }
                updateStrokePreview();
            }

            colorDots.forEach(dot => {
                dot.addEventListener('click', () => {
                    colorDots.forEach(d => d.classList.remove('active'));
                    dot.classList.add('active');
                    if (document.getElementById('tempCustomDot')) document.getElementById('tempCustomDot').classList.remove('active');
                    applyColor(dot.getAttribute('data-color'));
                });
            });

            alphaSlider.addEventListener('input', (e) => {
                currentAlpha = e.target.value;
                alphaVal.innerText = Math.round(currentAlpha * 100) + '%';
                applyColor(lastBaseColor);
            });

            customColorBtn.addEventListener('click', () => hiddenColorInput.click());
            hiddenColorInput.addEventListener('input', (e) => {
                const color = e.target.value;
                let customDot = document.getElementById('tempCustomDot');
                if (!customDot) {
                    customDot = document.createElement('div');
                    customDot.id = 'tempCustomDot';
                    customDot.className = 'color-dot';
                    document.getElementById('colorPicker').insertBefore(customDot, customColorBtn);
                    // Re-wire event listener for the new dot
                    customDot.addEventListener('click', () => {
                        colorDots.forEach(d => d.classList.remove('active'));
                        customDot.classList.add('active');
                        applyColor(color);
                    });
                }
                customDot.style.background = color;
                customDot.setAttribute('data-color', color);
                colorDots.forEach(d => d.classList.remove('active'));
                customDot.classList.add('active');
                applyColor(color);
            });

            // Preset Buttons (Stroke Type)
            document.querySelectorAll('#strokeTypePresets .preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#strokeTypePresets .preset-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentStrokeType = btn.dataset.preset;
                    updateStrokeStyles();
                    if (selectedStrokeIndices.length > 0) {
                        // updateThickness handles saveState internally
                        updateThickness(currentThickness);
                    }
                });
            });

            // Update beginStroke to handle history
            signaturePad.addEventListener("beginStroke", () => {
                if (currentMode === 'select' || currentMode === 'move' || currentMode === 'resize') return;
                saveState();
                hint.classList.add('hidden');
            });

            // Copy PNG
            const copyPngBtn = document.getElementById('copyPngBtn');
            copyPngBtn.addEventListener('click', async () => {
                if (signaturePad.isEmpty()) {
                    showToast("Por favor, firma primero", "#ef4444");
                    return;
                }
                try {
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    showToast("Firma copiada como PNG");
                } catch (err) {
                    console.error(err);
                    showToast("Error al copiar PNG", "#ef4444");
                }
            });

            // Download PNG
            const downloadPngBtn = document.getElementById('downloadPngBtn');
            downloadPngBtn.addEventListener('click', () => {
                if (signaturePad.isEmpty()) {
                    showToast("Por favor, firma primero", "#ef4444");
                    return;
                }
                const dataURL = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = dataURL;
                link.download = 'firma.png';
                link.click();
                showToast("PNG descargado");
            });

            // Download SVG
            downloadSvgBtn.addEventListener('click', () => {
                if (signaturePad.isEmpty()) {
                    showToast("Por favor, firma primero", "#ef4444");
                    return;
                }
                const svgData = signaturePad.toSVG();
                const blob = new Blob([svgData], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'firma.svg';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                showToast("SVG descargado");
                exportDropdown.classList.remove('active');
            }
            );

            // Dropdown Logic
            const exportDropdown = document.getElementById('exportDropdown');
            const exportMainBtn = document.getElementById('exportMainBtn');

            exportMainBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                exportDropdown.classList.toggle('active');
            });

            document.addEventListener('click', () => {
                exportDropdown.classList.remove('active');
            });

            // Close when clicking items
            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.addEventListener('click', () => {
                    exportDropdown.classList.remove('active');
                });
            });

            function showToast(message, color = "#10b981") {
                toast.innerText = message;
                toast.style.background = color;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // --- New Panel Logic ---
            const sidePanel = document.getElementById('sidePanel');
            const sidePanelContent = document.getElementById('sidePanelContent');
            const minimizeBtn = document.getElementById('minimizeBtn');
            const dockBtn = document.getElementById('dockBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const darkModeToggle = document.getElementById('darkModeToggle');
            const langBtns = document.querySelectorAll('.lang-btn');

            // Translations
            const i18n = {
                es: {
                    panelTitle: "PANEL DE CONTROL",
                    fullscreen: "PANTALLA COMPLETA",
                    darkMode: "MODO OSCURO",
                    language: "IDIOMA",
                    stroke: "TRAZO",
                    color: "COLOR",
                    natural: "Natural",
                    marker: "Marcador",
                    pen: "Pluma",
                    opacity: "OPACIDAD",
                    thickness: "GROSOR",
                    canvas: "LIENZO",
                    width: "ANCHO",
                    height: "ALTO",
                    export: "EXPORTAR",
                    copyPng: "Copiar PNG al Portapapeles",
                    downloadPng: "Descargar como PNG",
                    downloadSvg: "Descargar como SVG",
                    drawMode: "Modo Dibujo (P)",
                    selectMode: "Modo Selección (V)",
                    transformMode: "Modo Transformar (T)",
                    panMode: "Mover Espacio (H)",
                    undo: "Deshacer",
                    clear: "Limpiar",
                    recenter: "RECENTRAR",
                    autoAdjust: "AJUSTAR AUTOMÁTICAMENTE",
                    preview: "PREVISUALIZACIÓN",
                    zoom: "ZOOM",
                    normal: "Normal",
                    medium: "Medio",
                    large: "Grande"
                },
                en: {
                    panelTitle: "CONTROL PANEL",
                    fullscreen: "FULL SCREEN",
                    darkMode: "DARK MODE",
                    language: "LANGUAGE",
                    stroke: "STROKE",
                    color: "COLOR",
                    natural: "Natural",
                    marker: "Marker",
                    pen: "Pen",
                    opacity: "OPACITY",
                    thickness: "THICKNESS",
                    canvas: "CANVAS",
                    width: "WIDTH",
                    height: "HEIGHT",
                    zoom: "ZOOM",
                    normal: "Normal",
                    medium: "Medium",
                    large: "Large",
                    export: "EXPORT",
                    copyPng: "Copy PNG to Clipboard",
                    downloadPng: "Download as PNG",
                    downloadSvg: "Download as SVG",
                    drawMode: "Drawing Mode (P)",
                    selectMode: "Selection Mode (V)",
                    transformMode: "Transform Mode (T)",
                    panMode: "Pan Workspace (H)",
                    undo: "Undo",
                    clear: "Clear",
                    recenter: "RECENTER",
                    autoAdjust: "AUTO ADJUST",
                    preview: "PREVIEW"
                }
            };

            let currentLang = 'es';

            function updateLanguage(lang) {
                currentLang = lang;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (i18n[lang][key]) {
                        el.innerText = i18n[lang][key];
                    }
                });

                // Update titles and special texts
                document.getElementById('panelTitle').innerText = i18n[lang].panelTitle;
                document.getElementById('exportMainBtn').innerHTML = `<i data-lucide="download" size="18"></i> ${i18n[lang].export} <i data-lucide="chevron-down" size="14" style="margin-left: 4px; opacity: 0.7;"></i>`;
                document.getElementById('copyPngBtn').innerHTML = `<i data-lucide="copy" size="16"></i> ${i18n[lang].copyPng}`;
                document.getElementById('downloadPngBtn').innerHTML = `<i data-lucide="image" size="16"></i> ${i18n[lang].downloadPng}`;
                document.getElementById('downloadSvgBtn').innerHTML = `<i data-lucide="file-code" size="16"></i> ${i18n[lang].downloadSvg}`;

                // Tooltips
                document.querySelector('[data-mode="draw"]').title = i18n[lang].drawMode;
                document.querySelector('[data-mode="select"]').title = i18n[lang].selectMode;
                document.querySelector('[data-mode="transform"]').title = i18n[lang].transformMode;
                document.querySelector('[data-mode="pan"]').title = i18n[lang].panMode;
                document.getElementById('undoBtn').title = i18n[lang].undo;
                document.getElementById('clearBtn').title = i18n[lang].clear;
                document.getElementById('centerCanvasBtn').innerText = i18n[lang].recenter;
                document.getElementById('resetSizeBtn').innerText = i18n[lang].autoAdjust;
                if (document.querySelector('[data-i18n="preview"]')) {
                    document.querySelector('[data-i18n="preview"]').innerText = lang === 'es' ? "PREVISUALIZACIÓN" : "PREVIEW";
                }

                lucide.createIcons();
            }

            // --- Stroke Preview Logic ---
            const previewCanvas = document.getElementById('strokePreviewCanvas');
            const pctx = previewCanvas.getContext('2d');

            function updateStrokePreview() {
                const w = previewCanvas.clientWidth;
                const h = previewCanvas.clientHeight;
                previewCanvas.width = w;
                previewCanvas.height = h;

                pctx.clearRect(0, 0, w, h);
                pctx.lineCap = 'round';
                pctx.lineJoin = 'round';
                pctx.strokeStyle = signaturePad.penColor;
                pctx.lineWidth = currentThickness;

                // Draw a sample stroke (a smooth wave)
                pctx.beginPath();
                const startX = 20;
                const endX = w - 20;
                const midY = h / 2;

                pctx.moveTo(startX, midY);

                // Different visual styles for the preview depending on stroke type
                if (currentStrokeType === 'marker') {
                    pctx.globalAlpha = 0.6;
                } else {
                    pctx.globalAlpha = 1.0;
                }

                // Bezier curve for a "human" look
                pctx.bezierCurveTo(
                    startX + (endX - startX) * 0.25, midY - 10,
                    startX + (endX - startX) * 0.75, midY + 10,
                    endX, midY
                );
                pctx.stroke();
                pctx.globalAlpha = 1.0;
            }

            // Initialize preview
            setTimeout(updateStrokePreview, 100);
            window.addEventListener('resize', updateStrokePreview);

            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    langBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateLanguage(btn.dataset.lang);
                });
            });

            // Minimize
            minimizeBtn.addEventListener('click', () => {
                sidePanel.classList.toggle('minimized');
                document.body.classList.toggle('panel-minimized', sidePanel.classList.contains('minimized'));
            });

            // Dock
            dockBtn.addEventListener('click', () => {
                sidePanel.classList.toggle('docked');
                document.body.classList.toggle('panel-docked', sidePanel.classList.contains('docked'));
            });

            // Fullscreen
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    fullscreenBtn.innerHTML = '<i data-lucide="minimize" size="16"></i>';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                        fullscreenBtn.innerHTML = '<i data-lucide="maximize" size="16"></i>';
                    }
                }
                lucide.createIcons();
            });

            // Dark Mode
            darkModeToggle.addEventListener('change', () => {
                if (darkModeToggle.checked) {
                    document.body.classList.remove('light-mode');
                } else {
                    document.body.classList.add('light-mode');
                }
            });

            // Clipboard Logic
            let clipboardStrokes = [];

            function copySelection() {
                if (selectedStrokeIndices.length === 0) return;

                const data = signaturePad.toData();
                clipboardStrokes = selectedStrokeIndices.map(index => {
                    // Deep copy
                    return JSON.parse(JSON.stringify(data[index]));
                });

                showToast("Trazos copiados", "#6366f1");
            }

            function pasteSelection() {
                if (clipboardStrokes.length === 0) return;

                // Save state BEFORE pasting
                saveState();

                const data = signaturePad.toData();
                const newIndices = [];

                // Calculate offset to prevent exact overlap
                const offset = 20 / workspaceScale;

                clipboardStrokes.forEach(stroke => {
                    const newStroke = JSON.parse(JSON.stringify(stroke));
                    newStroke.points.forEach(p => {
                        p.x += offset;
                        p.y += offset;
                    });
                    data.push(newStroke);
                    newIndices.push(data.length - 1);
                });

                signaturePad.fromData(data);

                // Select pasted items, don't save again
                selectStrokes(newIndices, false);

                showToast("Trazos pegados", "#6366f1");
            }

            function deleteSelection() {
                if (selectedStrokeIndices.length === 0) return;

                // Save state BEFORE deleting
                saveState();

                const data = signaturePad.toData();
                // Filter out selected indices
                const newData = data.filter((_, index) => !selectedStrokeIndices.includes(index));

                signaturePad.fromData(newData);
                deselectStroke(false); // Don't save, we just saved

                if (newData.length === 0) hint.classList.remove('hidden');
            }

            // Keyboard shortcuts
            window.addEventListener('keydown', (e) => {
                const isInput = ['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase());
                if (isInput) return;

                // Copy (Ctrl+C)
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
                    e.preventDefault();
                    copySelection();
                    return;
                }

                // Paste (Ctrl+V)
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
                    e.preventDefault();
                    pasteSelection();
                    return;
                }

                // Delete / Backspace
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedStrokeIndices.length > 0) {
                        e.preventDefault();
                        deleteSelection();
                    }
                    return;
                }

                // Undo / Redo
                if (e.ctrlKey || e.metaKey) {
                    if (e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) redo();
                        else undo();
                    }
                    if (e.key.toLowerCase() === 'y') {
                        e.preventDefault();
                        redo();
                    }
                    return;
                }

                // Tools
                const key = e.key.toLowerCase();
                if (key === 'p') setMode('draw');
                if (key === 'v') setMode('select');
                if (key === 't') setMode('transform');
                if (key === 'h') setMode('pan');

                // Minimize
                if (key === 'm') {
                    sidePanel.classList.toggle('minimized');
                    document.body.classList.toggle('panel-minimized', sidePanel.classList.contains('minimized'));
                }
            });

            // Warn before leaving if there are changes
            window.addEventListener('beforeunload', (e) => {
                // If there is any data in signature pad OR history stack has items, consider it unsaved work
                if (!signaturePad.isEmpty() || history.length > 0) {
                    e.preventDefault();
                    e.returnValue = ''; // Required for Chrome/Firefox/Edge to show the confirmation dialog
                }
            });
        </script>
