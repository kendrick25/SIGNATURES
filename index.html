<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmas Vectoriales</title>
    <meta name="description" content="Generador de firmas digitales de alta calidad.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="loading panel-docked panel-minimized" style="background-color: #0f172a;">
    <div id="splash-screen">
        <div class="splash-logo"></div>
        <div class="splash-loader">
            <div class="splash-progress"></div>
        </div>
    </div>

    <div class="main-app-container">
        <!-- GLOBAL APP HEADER -->
        <header class="app-header">
            <div class="header-main-row">
                <div class="header-left">
                    <div class="app-logo">
                        <i data-lucide="feather" class="logo-icon"></i>
                        <span class="logo-text">FIRMAS</span>
                    </div>
                </div>

                <div class="header-center">
                    <!-- Row is cleaner now -->
                </div>

                <div class="header-right">
                    <button class="navbar-tool-btn" id="settingsToggle" title="Configuración">
                        <i data-lucide="settings"></i>
                    </button>
                </div>
            </div>

            <div class="header-sub-row">
                <button class="header-tool-btn" id="workspaceToggle" title="Mostrar/Ocultar Panel de Control">
                    <i data-lucide="layout-grid"></i>
                </button>
                <div class="header-sub-separator"></div>
                <div class="tool-group" id="modeToggle"></div>
                <div class="header-sub-separator"></div>
                <div class="header-sub-spacing"></div>

                <div class="tool-group">

                    <button class="header-tool-btn" id="recenterBtnTop" title="Recentrar Lienzo">
                        <i data-lucide="focus"></i>
                    </button>
                </div>
                <div class="tool-separator"></div>
                <div class="tool-group" id="historyTools"></div>
                <div class="tool-separator"></div>
                <div class="dropdown" id="exportDropdown">
                    <button class="btn-primary btn-pill" id="exportMainBtn">
                        <i data-lucide="download"></i>
                        <span data-i18n="export">EXPORTAR</span>
                        <i data-lucide="chevron-down"></i>
                    </button>
                    <div class="dropdown-menu"></div>
                </div>
            </div>
        </header>

        <div class="app-main-layout">
            <!-- Left Side Control Panel -->
            <div class="side-panel docked minimized" id="sidePanel" data-stored-width="320">
                <div class="side-panel-main">
                    <div class="side-panel-header">
                        <div class="panel-header-controls">
                            <div class="panel-title">

                                <span class="panel-title-text" data-i18n="panelTitle">PANEL DE CONTROL</span>
                            </div>
                        </div>
                        <div class="panel-header-spacing"></div>
                    </div>

                    <div class="side-panel-content">
                        <div class="side-panel-scroll-container" id="sidePanelContent">
                            <!-- Group TRAZO -->
                            <div class="panel-group" id="groupStroke">
                                <div class="panel-row-header">
                                    <span class="panel-group-title" data-i18n="stroke">TRAZO</span>
                                    <div class="panel-group-actions">
                                    </div>
                                </div>
                                <div class="panel-sub-group">
                                    <div class="stroke-presets-container" id="strokeTypePresets"></div>
                                    <div class="stroke-preview-container">
                                        <span class="preview-label" data-i18n="preview">PREVISUALIZACIÓN</span>
                                        <canvas id="strokePreviewCanvas"></canvas>
                                    </div>
                                    <div class="panel-input-group">
                                        <span class="panel-input-label" data-i18n="color">COLOR</span>
                                        <div class="color-picker" id="colorPicker"></div>
                                    </div>
                                    <div class="panel-input-group">
                                        <div class="panel-input-header">
                                            <span class="panel-input-label" data-i18n="opacity">OPACIDAD</span>
                                            <span id="alphaVal" class="panel-val-text">100%</span>
                                        </div>
                                        <input type="range" id="alphaSlider" min="0.1" max="1.0" step="0.05" value="1.0"
                                            class="alpha-slider">
                                    </div>
                                    <div class="panel-input-group">
                                        <span class="panel-input-label" data-i18n="thickness">GROSOR</span>
                                        <div class="thickness-control">
                                            <button class="scrub-btn" id="decWidth"><i data-lucide="minus"></i></button>
                                            <div class="scrub-area" id="thicknessScrubArea">
                                                <input type="number" class="thickness-input" id="thicknessVal"
                                                    value="2.5" step="0.1" min="1" max="20">
                                            </div>
                                            <button class="scrub-btn" id="incWidth"><i data-lucide="plus"></i></button>
                                        </div>
                                        <input type="range" id="thicknessSlider" min="1" max="20" step="0.1" value="2.5"
                                            class="thickness-slider">
                                    </div>
                                </div>
                            </div>

                            <!-- Group LIENZO -->
                            <div class="panel-group panel-section-spacing" id="groupCanvas">
                                <div class="panel-row-header">
                                    <span class="panel-group-title" data-i18n="canvas">LIENZO</span>
                                    <div class="panel-group-actions">
                                    </div>
                                </div>
                                <div class="stroke-presets-container" id="canvasSizePresets"></div>
                                <div class="panel-sub-group">
                                    <div class="panel-input-group">
                                        <span class="panel-input-label" data-i18n="width">ANCHO</span>
                                        <div class="thickness-control">
                                            <button class="scrub-btn" id="decCanvasWidth"><i
                                                    data-lucide="minus"></i></button>
                                            <div class="scrub-area" id="widthScrubArea">
                                                <input type="number" class="thickness-input" id="canvasWidthVal"
                                                    value="836">
                                            </div>
                                            <button class="scrub-btn" id="incCanvasWidth"><i
                                                    data-lucide="plus"></i></button>
                                        </div>
                                        <input type="range" id="widthSlider" min="200" max="2000" step="10" value="836"
                                            class="canvas-range">
                                    </div>
                                    <div class="panel-input-group">
                                        <span class="panel-input-label" data-i18n="height">ALTO</span>
                                        <div class="thickness-control">
                                            <button class="scrub-btn" id="decCanvasHeight"><i
                                                    data-lucide="minus"></i></button>
                                            <div class="scrub-area" id="heightScrubArea">
                                                <input type="number" class="thickness-input" id="canvasHeightVal"
                                                    value="400">
                                            </div>
                                            <button class="scrub-btn" id="incCanvasHeight"><i
                                                    data-lucide="plus"></i></button>
                                        </div>
                                        <input type="range" id="heightSlider" min="100" max="1000" step="10" value="400"
                                            class="canvas-range">
                                    </div>

                                    <div class="panel-input-group">
                                        <span class="panel-input-label" data-i18n="zoom">ZOOM</span>
                                        <div class="thickness-control">
                                            <button class="scrub-btn" id="decZoom"><i data-lucide="minus"></i></button>
                                            <div class="scrub-area" id="zoomScrubArea">
                                                <input type="number" class="thickness-input" id="zoomVal" value="100"
                                                    step="1" min="10" max="500">
                                                <span class="zoom-unit">%</span>
                                            </div>
                                            <button class="scrub-btn" id="incZoom"><i data-lucide="plus"></i></button>
                                        </div>
                                        <input type="range" id="zoomSlider" min="10" max="500" step="1" value="100"
                                            class="canvas-range">
                                    </div>
                                </div>
                            </div>

                            <!-- Group TRANSFORMACIÓN -->
                            <div class="panel-group panel-section-spacing" id="groupTransform">
                                <div class="panel-row-header">
                                    <span class="panel-group-title" data-i18n="transformation">TRANSFORMACIÓN</span>
                                    <div class="panel-group-actions">
                                    </div>
                                </div>
                                <div class="panel-sub-group">
                                    <div class="transform-controls-grid">
                                        <button class="btn-secondary btn-tool-square" id="rotateLeftBtn"
                                            title="Girar Izquierda" data-i18n-title="rotateL">
                                            <i data-lucide="rotate-ccw"></i>
                                        </button>
                                        <button class="btn-secondary btn-tool-square" id="rotateRightBtn"
                                            title="Girar Derecha" data-i18n-title="rotateR">
                                            <i data-lucide="rotate-cw"></i>
                                        </button>
                                        <button class="btn-secondary btn-tool-square" id="flipHBtn"
                                            title="Reflejo Horizontal" data-i18n-title="flipH">
                                            <i data-lucide="flip-horizontal"></i>
                                        </button>
                                        <button class="btn-secondary btn-tool-square" id="flipVBtn"
                                            title="Reflejo Vertical" data-i18n-title="flipV">
                                            <i data-lucide="flip-vertical"></i>
                                        </button>
                                    </div>
                                    <div class="panel-input-group">
                                        <span class="panel-input-label" data-i18n="scale">ESCALAR</span>
                                        <div class="thickness-control">
                                            <button class="scrub-btn" id="decScale"><i data-lucide="minus"></i></button>
                                            <div class="scrub-area" id="scaleScrubArea">
                                                <input type="number" class="thickness-input" id="scaleVal" value="100"
                                                    step="1">
                                                <span class="zoom-unit">%</span>
                                            </div>
                                            <button class="scrub-btn" id="incScale"><i data-lucide="plus"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Left Sidebar Resizer on its RIGHT -->
                <div class="panel-resizer" id="sidePanelResizer"></div>
            </div>

            <!-- Workspace Area -->
            <div class="workspace" id="workspace">
                <div class="canvas-view-port">
                    <div class="canvas-container" id="canvasContainer">
                        <div class="canvas-hint" id="canvasHint">
                            <i data-lucide="pen-tool" class="hint-icon"></i>
                            <span data-i18n="canvasHint">Dibuja tu firma aquí</span><br>
                            <span class="hint-subtext" data-i18n="canvasHintSub">(Compatible con tabletas
                                digitales)</span>
                        </div>
                        <div id="selectedBounds" class="selected-bounds">
                            <div class="resize-handle handle-r" id="resizeHandleR" data-type="r"></div>
                            <div class="resize-handle handle-b" id="resizeHandleB" data-type="b"></div>
                            <div class="resize-handle handle-br" id="resizeHandleBR" data-type="br"></div>
                            <div class="resize-handle handle-rotate" id="rotateHandle" data-type="rotate" title="Rotar">
                            </div>
                        </div>
                        <div class="selection-box" id="dragSelection"></div>
                        <div class="selected-stroke-info" id="selectionInfo">Trazos Seleccionados: 0</div>
                        <canvas id="signatureCanvas"></canvas>
                        <canvas id="selectionCanvas" class="selection-canvas-layer"></canvas>
                    </div>


                </div>

                <!-- Docking Areas -->
                <div class="workspace-sidebar-right" id="rightSidebar">
                    <div class="sidebar-resizer" id="rightSidebarResizer"></div>
                    <div class="sidebar-inner-container">
                        <div class="sidebar-scroll-container" id="rightSidebarContent"></div>
                    </div>
                </div>

                <div class="workspace-sidebar-top" id="topSidebar">
                    <div class="sidebar-inner-container">
                        <div class="sidebar-scroll-container" id="topSidebarContent"></div>
                    </div>
                    <div class="sidebar-resizer" id="topSidebarResizer"></div>
                </div>

                <div class="workspace-sidebar-bottom" id="bottomSidebar">
                    <div class="sidebar-resizer" id="bottomSidebarResizer"></div>
                    <div class="sidebar-inner-container">
                        <div class="sidebar-scroll-container" id="bottomSidebarContent"></div>
                    </div>
                </div>


            </div>
        </div>
    </div>

    <!-- Dropdowns & Overlays -->
    <div class="settings-dropdown" id="settingsMenu">
        <div class="settings-header">CONFIGURACIÓN</div>
        <div class="panel-config-group" id="config-group"></div>
    </div>

    <div class="toast" id="toast">Firma copiada al portapapeles</div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
