<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Signature Processor | INSLAB Premium</title>
    <!-- pdf-lib library -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-badge {
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .content-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            min-height: 0;
            margin-bottom: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .console {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        .console::-webkit-scrollbar {
            width: 8px;
        }

        .console::-webkit-scrollbar-track {
            background: transparent;
        }

        .console::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            display: flex;
            gap: 1rem;
            animation: fadeInBlur 0.3s ease-out forwards;
        }

        .log-time {
            color: rgba(255, 255, 255, 0.3);
            white-space: nowrap;
        }

        .log-tag {
            font-weight: 600;
            min-width: 70px;
            text-align: right;
        }

        .tag-info {
            color: var(--accent);
        }

        .tag-load {
            color: var(--primary);
        }

        .tag-done {
            color: var(--success);
        }

        .tag-warn {
            color: var(--warning);
        }

        .tag-error {
            color: var(--error);
        }

        .tag-test {
            color: #a855f7;
        }

        .log-msg {
            color: var(--text-main);
            word-break: break-all;
        }

        .footer-controls {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            animation: fadeInUp 0.8s ease-out;
        }

        button {
            padding: 0.8rem 1.5rem;
            border-radius: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInBlur {
            from {
                opacity: 0;
                filter: blur(4px);
                transform: translateX(-5px);
            }

            to {
                opacity: 1;
                filter: blur(0);
                transform: translateX(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.2rem;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Custom scrollbar for log container */
        .console {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <header>
            <div class="logo-container">
                <div class="logo-badge">INSLAB</div>

            <div class="status-badge">

        <div class="content-grid">
            <div class="card">

                <div class="console" id="logConsole">

                </div>
            </div>
        </div>

        <div class="footer-controls">

            </button>
            <button class="btn-primary" id="testBtn">
                <span>Run Test Batch</span>
            </button>
        </div>
    </div>

        const TEST_SIGNATURES = [
            { pageNumber: 1, imageKey: 'Firma1', size: 'width:150;height:45', position: 'x:50;y:680' },

        // ================= LOGGING ENGINE =================
        const logConsole = document.getElementById('logConsole');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        function log(tag, msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            const time = new Date().toLocaleTimeString('en-US', { hour12: false, fractionalSecondDigits: 2 });

            entry.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-tag tag-${tag.toLowerCase()}">[${tag}]</span>
                <span class="log-msg">${msg}</span>
            `;

            logConsole.appendChild(entry);
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        function clearLogs() {
            logConsole.innerHTML = '';
            log('INFO', 'Log console cleared');
        }

        function setStatus(text, colorClass = 'success') {
            statusText.textContent = text;
            const colors = {
                success: '#10b981',
                warning: '#f59e0b',
                error: '#ef4444',
                busy: '#6366f1'
            };
            statusDot.style.background = colors[colorClass] || colors.success;
            statusDot.style.boxShadow = `0 0 8px ${colors[colorClass] || colors.success}`;
        }

        // ================= CORE UTILS =================
        function parsePropString(str) {
            if (!str) return {};
            if (typeof str === 'object') return str;

            const result = {};
            // Handles width:150;height:45 OR "width:150;height:45"
            str.replace(/"/g, '').split(';').forEach(pair => {
                const p = pair.split(':');
                if (p.length >= 2) {
                    const key = p[0].toLowerCase().trim();
                    const val = parseFloat(p[1]);
                    if (!isNaN(val)) result[key] = val;
                }
            });
            return result;
        }

        function base64ToArrayBuffer(base64) {
            try {
                const clean = base64.replace(/[^A-Za-z0-9+\/=]/g, '');
                const binary = atob(clean);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return bytes.buffer;
            } catch (e) {
                log('ERROR', 'Failed to decode base64 string');
                throw e;
            }
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            return btoa(binary);
        }

        function triggerDownload(data, filename) {
            const blob = new Blob([data], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log('DONE', `Download triggered: ${filename}`);
        }

        // ================= PDF PROCESSING ENGINE =================
        async function processPDFRequest(req) {
            const startTime = performance.now();
            setStatus('Processing...', 'busy');

            try {
                // VALIDATION
                if (!req) throw new Error('Request payload is empty');
                if (!req.pdfContent) throw new Error('Missing pdfContent (base64 string)');
                if (!req.signatureImages || Object.keys(req.signatureImages).length === 0) throw new Error('No signature images provided');
                if (!req.signatures || req.signatures.length === 0) throw new Error('No signature placement data provided');

                log('LOAD', 'Parsing PDF document structure...');
                const pdfDoc = await PDFDocument.load(base64ToArrayBuffer(req.pdfContent));
                const totalPages = pdfDoc.getPageCount();
                log('LOAD', `Successfully loaded PDF with ${totalPages} pages`);

                // EMBED IMAGES
                log('INFO', 'Embedding signature images into PDF resources...');
                const embeddedImages = {};
                for (const key of Object.keys(req.signatureImages)) {
                    const img64 = req.signatureImages[key];
                    if (!img64) {
                        log('WARN', `Skipping empty image for key: ${key}`);
                        continue;
                    }

                    try {
                        const bytes = base64ToArrayBuffer(img64);
                        // Assumption: Signatures are PNG (transparent)
                        embeddedImages[key] = await pdfDoc.embedPng(bytes);
                        log('INFO', `Resource embedded: ${key}`);
                    } catch (e) {
                        log('WARN', `Failed to embed image "${key}": ${e.message}`);
                    }
                }

                // PLACE SIGNATURES
                log('INFO', 'Mapping signature coordinates to pages...');
                let signaturesPlaced = 0;

                for (const sig of req.signatures) {
                    if (!sig) continue;

                    const pageNum = parseInt(sig.pageNumber);
                    if (isNaN(pageNum) || pageNum < 1 || pageNum > totalPages) {
                        log('WARN', `Invalid page number: ${sig.pageNumber}. Skipping signature.`);
                        continue;
                    }

                    const img = embeddedImages[sig.imageKey];
                    if (!img) {
                        log('WARN', `Target image "${sig.imageKey}" not found in resources.`);
                        continue;
                    }

                    const page = pdfDoc.getPage(pageNum - 1);
                    const { width: pW, height: pH } = page.getSize();

                    // Parse properties (handle both string and object)
                    const size = parsePropString(sig.size);
                    const pos = parsePropString(sig.position);

                    const w = size.width || 120;
                    const h = size.height || size.heigth || 40; // handle typo
                    const x = pos.x || 0;
                    const y = pos.y || 0;

                    // Coordinate Mapping: 
                    // Browser/Client uses Top-Left (0,0)
                    // PDF-Lib uses Bottom-Left (0,0)
                    // Formula: pdf_y = page_height - topleft_y - item_height
                    const pdfX = x;
                    const pdfY = pH - y - h;

                    page.drawImage(img, {
                        x: pdfX,
                        y: pdfY,
                        width: w,
                        height: h
                    });

                    log('DONE', `Placed "${sig.imageKey}" on page ${pageNum} at [${Math.round(x)}, ${Math.round(y)}]`);
                    signaturesPlaced++;
                }

                log('INFO', 'Finalizing document serializing...');
                const finalBytes = await pdfDoc.save();
                const base64Pdf = arrayBufferToBase64(finalBytes);
                const endTime = performance.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);

                log('DONE', `Processing complete in ${duration}s. Total signatures: ${signaturesPlaced}`);
                setStatus('Success', 'success');

                // Auto-Download if requested
                if (req.debugDownload) {
                    const downloadName = req.documentName || 'signed_document.pdf';
                    triggerDownload(finalBytes, downloadName);
                }

                return {
                    status: 'success',
                    fileName: req.documentName,
                    signaturesCount: signaturesPlaced,
                    pdfContent: base64Pdf,
                    processingTime: duration
                };

            } catch (err) {
                log('ERROR', err.message);
                setStatus('Error', 'error');
                return { status: 'error', message: err.message };
            }
        }

        // ================= INTERFACE & EVENTS =================

        // Handle postMessage (Standard for Iframe integration)
        window.addEventListener('message', async (event) => {
            // Check for method: 'POST' in the payload
            if (event.data && event.data.method === 'POST') {
                log('INFO', 'Request received via Message Channel');
                const result = await processPDFRequest(event.data.payload);

                // Reply to parent
                if (window.parent) {
                    window.parent.postMessage({
                        type: 'INSLAB_PDF_RESPONSE',
                        payload: result
                    }, '*');
                }
            }
        });

        log('INFO', 'Application strictly waiting for JSON payload...');
